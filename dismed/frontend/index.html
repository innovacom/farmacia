<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>INNOVACOM — ERP Distribución Médica</title>
    <link rel="icon" href="/icon-192.png" />

    <!-- Open Graph / Twitter Card — genéricos para todo el dominio (Apache
         sirve este mismo index.html para cualquier ruta, no solo /tienda; ver
         memoria project_tienda_web_farmacia Fase 3). Son la vista previa que
         ve WhatsApp/Facebook al compartir un link: esos bots leen el HTML
         crudo y no ejecutan React, así que no pueden variar por producto sin
         tocar Apache — decisión explícita: previsualización genérica.
         og:image usa una ruta relativa a propósito: este archivo se
         despliega igual en instancias con dominios distintos (dismed,
         farmacia), así que no se puede fijar un dominio absoluto aquí. -->
    <meta name="description" content="Catálogo de farmacia en línea. Consulta productos y precios, y pide por WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="INNOVACOM — Farmacia en línea" />
    <meta property="og:description" content="Consulta productos y precios, y pide por WhatsApp." />
    <meta property="og:image" content="/logo_innovacom.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INNOVACOM — Farmacia en línea" />
    <meta name="twitter:description" content="Consulta productos y precios, y pide por WhatsApp." />
    <meta name="twitter:image" content="/logo_innovacom.png" />

    <!-- Manrope + Inter: usadas solo por el catálogo público /tienda (ver
         tailwind.config.js font-tienda / font-tienda-display). El resto del
         ERP sigue con la fuente del sistema; degrada con gracia sin conexión. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#00ACC1" />

    <!-- iOS: instalable desde Safari con "Agregar a inicio" -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="INNOVACOM" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
